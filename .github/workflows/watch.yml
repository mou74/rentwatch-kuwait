name: RentWatch Kuwait (every 30 min)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rentwatch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check listings and notify
        env:
          RENTWATCH_SMTP_USER: ${{ secrets.SMTP_USER }}
          RENTWATCH_SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RENTWATCH_EMAIL_TO: ${{ secrets.EMAIL_TO }}
          RENTWATCH_TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          RENTWATCH_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m rentwatch run --no-macos
      - name: Save state and dashboard
        run: |
          git config user.name "rentwatch-bot"
          git config user.email "rentwatch-bot@users.noreply.github.com"
          git add data/rentwatch.db docs/index.html
          git diff --cached --quiet || git commit -m "rentwatch: $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
          git push
